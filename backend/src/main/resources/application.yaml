spring:
  application:
    name: E-commerce

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:OAUTH_DISABLED}
            client-secret: ${GITHUB_CLIENT_SECRET:OAUTH_DISABLED}
            # En local {baseUrl} sale del navegador (nginx/proxy). En la nube el front (Vercel)
            # reenvía al back y conviene fijarla: OAUTH2_CALLBACK_BASE=https://<front>.
            redirect-uri: ${OAUTH2_CALLBACK_BASE:{baseUrl}}/login/oauth2/code/{registrationId}
            scope:
              - user:email
              - read:user
          google:
            client-id: ${GOOGLE_CLIENT_ID:OAUTH_DISABLED}
            client-secret: ${GOOGLE_CLIENT_SECRET:OAUTH_DISABLED}
            # En local {baseUrl} sale del navegador (nginx/proxy). En la nube el front (Vercel)
            # reenvía al back y conviene fijarla: OAUTH2_CALLBACK_BASE=https://<front>.
            redirect-uri: ${OAUTH2_CALLBACK_BASE:{baseUrl}}/login/oauth2/code/{registrationId}
            # Sin "openid" a propósito: así Google pasa por el mismo OAuth2ClienteService que
            # GitHub (con openid Spring usaría el flujo OIDC, que necesita otro servicio).
            scope:
              - email
              - profile

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Argentina/Buenos_Aires
    open-in-view: false

  servlet:
    multipart:
      # Imágenes de producto: el service valida 2 MB, acá dejamos un poco de margen.
      max-file-size: 3MB
      max-request-size: 5MB

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Mailpit (el SMTP local de Docker) no pide auth ni TLS; Mailtrap sí.
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  # Render (y otros PaaS) dicen en PORT dónde escuchar.
  port: ${PORT:8080}
  shutdown: graceful
  # Detrás de nginx (Docker) o del proxy de ng serve: arma las URLs con el host y el
  # puerto del navegador (localhost:4200), no con los del contenedor. Lo necesita el
  # redirect_uri que se le manda a GitHub y Google.
  forward-headers-strategy: framework

# Solo el health endpoint, y sin detalles internos hacia afuera.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

mercadopago:
  # Vacío = MercadoPago no aparece como opción de pago. Las URLs de vuelta salen de FRONT_URL.
  # El webhook (/api/v1/webhook/mercadopago, tópico "order") se configura en el panel de
  # MercadoPago y solo llega con una URL pública (ngrok); sin él, confirma la pantalla de vuelta.
  access-token: ${MP_ACCESS_TOKEN:}

correo-argentino:
  base-url: https://apitest.correoargentino.com.ar/micorreo/v1
  user-token: ${CORREO_ARGENTINO_USER_TOKEN:}
  password-token: ${CORREO_ARGENTINO_PASSWORD_TOKEN:}
  customer-id: ${CORREO_ARGENTINO_CUSTOMER_ID:}
  codigo-postal-origen: "1425"

# Localidades para las direcciones (API del Estado argentino, gratis y sin key).
georef:
  base-url: https://apis.datos.gob.ar/georef/api

notificaciones:
  remitente: ${MAIL_FROM:no-reply@ecommerce-blandi-arruti.com}

app:
  # Base de los enlaces que van en los mails (ej. recuperar la contraseña).
  front-url: ${FRONT_URL:http://localhost:4200}
  cors:
    # Orígenes del front autorizados, separados por coma.
    allowed-origins: ${FRONT_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}
  ofertas-demo:
    # Carga descuentos de ejemplo en una base existente si todavía no hay ofertas.
    habilitadas: ${OFERTAS_DEMO:true}
  oauth2:
    # A dónde vuelve el navegador tras el login con GitHub. Vacío = devuelve JSON (Postman).
    redirect-uri: ${OAUTH2_REDIRECT_URI:}
