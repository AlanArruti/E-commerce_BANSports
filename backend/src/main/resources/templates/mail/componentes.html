<!DOCTYPE html>
<!-- Piezas que se repiten entre mails. Se usan con th:replace="~{mail/componentes :: boton('Texto', ${url})}". -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Antetítulo verde en mayúsculas, como las etiquetas del sitio. -->
<p th:fragment="etiqueta(texto)"
   style="margin:0 0 12px; font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#2be37a;"
   th:text="${texto}">Etiqueta</p>

<!-- Botón principal (.btn-primario). Hecho con una tabla para que Outlook respete el fondo y el tamaño. -->
<table th:fragment="boton(texto, url)" role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 4px;">
  <tr>
    <td bgcolor="#2be37a" style="background-color:#2be37a; border-radius:10px;">
      <a th:href="${url}" target="_blank"
         style="display:inline-block; padding:17px 30px; font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; line-height:1; color:#06110a; text-decoration:none; border-radius:10px;"
         th:text="${texto}">Botón</a>
    </td>
  </tr>
</table>

</body>
</html>
