server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Imágenes de producto: el backend acepta hasta 2 MB.
    client_max_body_size 5m;

    # Comprime JS, CSS, JSON e íconos: el bundle de Angular viaja varias veces más liviano.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # La API va al contenedor del backend (nombre del servicio en compose).
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login con GitHub y Google: el navegador arranca en /oauth2/authorization/{proveedor}
    # y el proveedor vuelve a /login/oauth2/code/{proveedor}. Las dos van al backend.
    # X-Forwarded-Host con $http_host conserva el puerto (localhost:4200): sin eso el back
    # arma la URL de vuelta sin puerto y GitHub/Google la rechazan por no coincidir con la
    # registrada. (Con X-Forwarded-Proto, Spring ignora el puerto del Host.)
    location ~ ^/(oauth2|login/oauth2)/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JS y CSS de Angular llevan un hash en el nombre (outputHashing: all): si cambia el
    # contenido cambia el nombre, así que el navegador los puede guardar un año sin preguntar.
    location ~* "-[0-9a-z_-]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo cae en index.html y la resuelve Angular.
    # index.html no se cachea: es el que apunta a los archivos con el hash nuevo tras un deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
