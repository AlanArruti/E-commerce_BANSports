server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Imágenes de producto: el backend acepta hasta 2 MB.
    client_max_body_size 5m;

    # La API va al contenedor del backend (nombre del servicio en compose).
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta que no sea un archivo cae en index.html y la resuelve Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
