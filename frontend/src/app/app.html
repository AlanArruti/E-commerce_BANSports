<div class="layout">
  <!-- El admin no navega la tienda: tiene su propio header con las secciones del panel y no ve el footer. -->
  @if (mostrarLayout()) {
    @if (authService.esAdmin()) {
      <app-header-admin />
    } @else {
      <app-header />
    }
  }
  <app-aviso-conexion />
  <main class="contenido">
    <router-outlet />
  </main>
  @if (mostrarLayout() && !authService.esAdmin()) {
    <app-footer />
  }
</div>
