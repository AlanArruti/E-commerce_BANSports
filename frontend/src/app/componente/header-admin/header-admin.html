<header class="header-admin">
  <div class="contenedor fila">
    <a routerLink="/admin" class="logo marca" aria-label="BAN Sports, ir al inicio del panel">
      <span class="logo-marca">BAN</span>
      <span class="logo-texto">SPORTS</span>
      <span class="etiqueta-panel">Panel</span>
    </a>

    <div class="sesion">
      <span class="usuario">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        {{ authService.usuario()?.sub }}
      </span>
      <button type="button" class="btn-texto btn-salir" aria-label="Cerrar sesión" (click)="cerrarSesion()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </div>

  <nav class="secciones" aria-label="Secciones del panel">
    <div class="contenedor secciones-fila">
      @for (seccion of secciones; track seccion.ruta) {
        <a
          [routerLink]="seccion.ruta"
          routerLinkActive="activa"
          [routerLinkActiveOptions]="seccion.ruta === '/admin' ? exacta : parcial"
          ariaCurrentWhenActive="page"
        >{{ seccion.etiqueta }}</a>
      }
    </div>
  </nav>
</header>
