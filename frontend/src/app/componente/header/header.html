<div class="anuncio">
  Envío gratis en compras desde $ [MONTO] · Hasta [N] cuotas sin interés con Mercado Pago
</div>

<header class="header">
  <div class="contenedor header-grilla">
    <button type="button" class="btn-menu" aria-label="Abrir menú">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>

    <a routerLink="/" class="logo header-logo" aria-label="BAN Sports, ir al inicio">
      <span class="logo-marca">BAN</span>
      <span class="logo-texto">SPORTS</span>
    </a>

    <nav class="categorias" aria-label="Categorías">
      @for (categoria of categorias; track categoria) {
        <a href="#" (click)="$event.preventDefault()">{{ categoria }}</a>
      }
      <a href="#" class="acento" (click)="$event.preventDefault()">Ofertas</a>
    </nav>

    <div class="buscador">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="buscar" class="solo-lectores">Buscar productos</label>
      <input id="buscar" type="search" placeholder="Buscá proteína, creatina…" />
    </div>

    <div class="acciones">
      @if (authService.estaLogueado()) {
        <a
          [routerLink]="authService.esAdmin() ? '/admin' : '/perfil'"
          class="link-ingresar"
          [attr.aria-label]="authService.esAdmin() ? 'Ir al panel de administración' : 'Ir a mi perfil'"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span>Hola, {{ nombreUsuario() }}</span>
        </a>
        <button type="button" class="btn-texto btn-salir" aria-label="Cerrar sesión" (click)="cerrarSesion()">
          <svg class="icono-salir" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>Cerrar sesión</span>
        </button>
      } @else {
        <a routerLink="/login" class="link-ingresar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span>Ingresar</span>
        </a>
        <a routerLink="/registro" class="btn-texto link-registro">Registrarse</a>
      }
      <button type="button" class="btn-icono carrito" aria-label="Carrito, 0 productos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
        <span class="contador">0</span>
      </button>
    </div>
  </div>
</header>
